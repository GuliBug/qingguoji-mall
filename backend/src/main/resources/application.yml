server:
  port: 8080

spring:
  application:
    name: mall-backend
  datasource:
    # 默认 H2 内存库（MODE=MySQL），免安装即可跑通；生产切 mysql profile
    url: jdbc:h2:mem:mall;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  order-timeout-scan: true

---
# 生产/联调配置：启动加 --spring.profiles.active=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/qingguoji_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
