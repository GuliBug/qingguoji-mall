server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mall-backend
  datasource:
    # 默认 H2 内存库（MODE=MySQL），免安装即可跑通；生产用 mysql profile
    url: ${DB_URL:jdbc:h2:mem:mall;MODE=MySQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

app:
  # 订单超时自动取消任务开关
  order-timeout-scan: ${ORDER_TIMEOUT_SCAN:true}
  # 演示种子数据开关，生产置 false
  demo-data: ${DEMO_DATA:true}

---
# 生产 / 联调用：--spring.profiles.active=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qingguoji_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
