# Docker Compose 一键部署（MySQL + 后端 + Nginx 托管两个前端）
# 使用：cd deploy && cp .env.example .env && 改密码 && docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: qgj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: qingguoji_mall
      MYSQL_USER: ${DB_USERNAME:-qingguoji}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mall

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: qgj-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: qingguoji_mall
      DB_USERNAME: ${DB_USERNAME:-qingguoji}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DEMO_DATA: "false"
      H2_CONSOLE: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8}
    ports:
      # 仅本机可访问，外网统一走 Nginx
      - "127.0.0.1:8080:8080"
    networks:
      - mall

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: qgj-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "8081:81"
    networks:
      - mall

volumes:
  mysql-data:

networks:
  mall:
    driver: bridge
