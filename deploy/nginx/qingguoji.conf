# 传统部署（不用 Docker）时放到 /etc/nginx/conf.d/qingguoji.conf
# 假设：Web 管理端静态文件 /opt/qingguoji/web，H5 静态文件 /opt/qingguoji/h5，后端 127.0.0.1:8080

upstream mall_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------- Web 管理端（80）----------
server {
    listen 80;
    server_name your-domain.com;

    root /opt/qingguoji/web;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /admin-api/ {
        proxy_pass http://mall_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://mall_backend;
        access_log off;
    }
}

# ---------- H5 客户端（8081）----------
server {
    listen 8081;
    server_name your-domain.com;

    root /opt/qingguoji/h5;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://mall_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
